name: Check portfolio and workflow tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check state, handoffs and failure paths
        run: |
          python site/workflow/research_state.py check
          python -m unittest discover -s site/workflow -p 'test_*.py'
      - run: npm ci
      - run: npm run pages
      - name: Check committed Pages output
        run: git diff --exit-code -- docs RESEARCH.md
